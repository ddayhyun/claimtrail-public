name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml 이 같은 커밋에서 이 3잡을 다시 돌린다. 복사하지 않고 부른다.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 는 tomllib 이 없어 detect.py 의 정규식 폴백 경로를 밟고,
        # 3.12 는 표준 라이브러리 tomllib 경로를 밟는다.
        # 두 경로를 최소 실행 비용으로 덮는 조합이다.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12"]
        include:
          # Windows 는 3.12 하나. 래퍼의 Windows 분기(.venv 탐색, ; 구분자)와
          # msvcrt 잠금은 여기서만 실제로 돈다.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # npm 러너 통합 테스트가 실행되려면 Node 가 있어야 한다.
      # 러너 이미지에 우연히 들어 있는 것에 기대지 않고 명시적으로 설치한다.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 패키지 설치 (휠 빌드까지 검증한다)
        run: |
          python -m pip install --upgrade pip
          pip install .

      # 러너가 호출하는 외부 도구들. 두 가지 이유로 필요하다.
      # 1) claimtrail 은 자기 pyproject.toml 의 [build-system] 을 탐지한다.
      #    build 가 없으면 탐지하고도 실행하지 못해 '검증 불가'가 되고,
      #    검증 불가를 통과로 취급하지 않으므로 종료 코드 2로 게이트가 막힌다.
      # 2) 이 도구들이 없으면 러너 통합 테스트가 전부 skip 된다. skip 은
      #    실패처럼 보이지 않아서, 어디서도 실행되지 않은 채 '테스트 있음'
      #    으로 남는다. 여기서 설치해 매 푸시마다 실제로 돌게 한다.
      - name: 러너가 쓰는 검증 도구 설치
        run: pip install pytest build ruff flake8 mypy

      - name: 설치된 CLI 확인
        run: claimtrail --version

      # 셸 통합 테스트는 bash 가 subprocess 의 PATH 에서 잡혀야 돈다. 없으면
      # skip 이 아니라 실패다 -- 조용히 안 도는 Windows 검증은 의미가 없다.
      - name: Git Bash 확인 (Windows)
        if: runner.os == 'Windows'
        run: python -c "import shutil, sys; p = shutil.which('bash'); print('bash =', p); sys.exit(0 if p and 'git' in p.lower() else 1)"

      # -rs: skip 된 테스트의 이름과 사유를 항상 남긴다. 스킵은 실패처럼
      # 보이지 않아서, 이름이 없으면 무엇이 안 돌았는지 로그로 알 수 없다.
      - name: pytest 직접 실행 (정답지)
        run: python -m pytest -q -rs

      - name: claimtrail 자기 검증 (종료 코드가 곧 게이트)
        run: claimtrail run -o evidence.md

      - name: 증빙을 잡 요약에 남긴다
        if: always()
        shell: bash
        run: |
          if [ -f evidence.md ]; then
            {
              echo "## 증빙 리포트 — Python ${{ matrix.python-version }}"
              echo
              cat evidence.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "evidence.md 가 생성되지 않았다. claimtrail run 이 실행되기 전에 실패했다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 증빙 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-py${{ matrix.python-version }}
          path: evidence.md
          if-no-files-found: warn
